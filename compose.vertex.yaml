# Overlay local para una credencial ADC o de servicio montada solo en lectura.
services:
  agente:
    environment:
      LLM_PROVIDER: vertex
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Indica la ruta absoluta de la credencial autorizada}
        target: /run/secrets/google-credentials.json
        read_only: true
